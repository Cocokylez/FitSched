<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">FitSched — your schedule, your pace</title>
  <desc id="desc">A dark FitSched banner with a weekly workout schedule, FitToken balance, and a ready-to-publish status.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B0F0E" />
      <stop offset="1" stop-color="#111817" />
    </linearGradient>
    <radialGradient id="blueGlow" cx="0" cy="0" r="1" gradientTransform="translate(180 116) rotate(35) scale(470 360)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1265FE" stop-opacity="0.30" />
      <stop offset="1" stop-color="#1265FE" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orangeGlow" cx="0" cy="0" r="1" gradientTransform="translate(1115 450) rotate(-145) scale(410 320)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF6B35" stop-opacity="0.16" />
      <stop offset="1" stop-color="#FF6B35" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="progress" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#1265FE" />
      <stop offset="1" stop-color="#5B9BFF" />
    </linearGradient>
    <filter id="panelShadow" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.36" />
    </filter>
    <clipPath id="frame">
      <rect width="1200" height="500" rx="30" />
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="500" fill="url(#background)" />
    <rect width="1200" height="500" fill="url(#blueGlow)" />
    <rect width="1200" height="500" fill="url(#orangeGlow)" />
    <path d="M0 412C180 352 336 368 500 430C639 483 821 502 1200 398V500H0V412Z" fill="#FFFFFF" fill-opacity="0.018" />
  </g>
  <rect x="1" y="1" width="1198" height="498" rx="29" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="2" />

  <g transform="translate(66 53)">
    <rect width="260" height="36" rx="18" fill="#1265FE" fill-opacity="0.12" stroke="#5B9BFF" stroke-opacity="0.34" />
    <circle cx="20" cy="18" r="5" fill="#47E891" />
    <text x="34" y="23" fill="#DCE8FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.1">RELEASE CANDIDATE · 99%</text>
  </g>

  <g transform="translate(66 118)">
    <rect width="68" height="68" rx="17" fill="#1265FE" />
    <rect x="10" y="17" width="48" height="42" rx="11" fill="#F7FAFF" />
    <rect x="17" y="8" width="9" height="20" rx="4.5" fill="#1265FE" />
    <rect x="42" y="8" width="9" height="20" rx="4.5" fill="#1265FE" />
    <rect x="18" y="28" width="10" height="9" rx="2" fill="#D9DFEF" />
    <rect x="31" y="28" width="10" height="9" rx="2" fill="#D9DFEF" />
    <rect x="44" y="28" width="10" height="9" rx="2" fill="#1265FE" />
    <rect x="18" y="40" width="10" height="9" rx="2" fill="#D9DFEF" />
    <rect x="31" y="40" width="10" height="9" rx="2" fill="#D9DFEF" />
    <rect x="44" y="40" width="10" height="9" rx="2" fill="#D9DFEF" />
    <rect x="14" y="47" width="7" height="15" rx="3.5" fill="#102531" />
    <rect x="47" y="47" width="7" height="15" rx="3.5" fill="#102531" />
    <rect x="20" y="52" width="28" height="5" rx="2.5" fill="#102531" />
  </g>

  <text x="153" y="173" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="72" font-weight="800" letter-spacing="-4">FitSched</text>
  <text x="67" y="235" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="29" font-weight="750" letter-spacing="-0.7">YOUR SCHEDULE. YOUR PACE.</text>
  <text x="67" y="282" fill="#9AA3A1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="500">A workout planner built around your goals, recovery,</text>
  <text x="67" y="311" fill="#9AA3A1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="500">equipment, and weekly training routine.</text>

  <g transform="translate(67 345)" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="0.7">
    <rect width="148" height="38" rx="19" fill="#1265FE" fill-opacity="0.11" stroke="#1265FE" stroke-opacity="0.38" />
    <text x="20" y="24" fill="#8AB6FF">80+ EXERCISES</text>
    <g transform="translate(160)">
      <rect width="118" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.035" stroke="#FFFFFF" stroke-opacity="0.12" />
      <text x="20" y="24" fill="#C9D0CE">GPS HIKES</text>
    </g>
    <g transform="translate(290)">
      <rect width="176" height="38" rx="19" fill="#FF6B35" fill-opacity="0.09" stroke="#FF6B35" stroke-opacity="0.30" />
      <text x="20" y="24" fill="#FF9B76">FITTOKEN REWARDS</text>
    </g>
  </g>

  <text x="67" y="444" fill="#5B9BFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">fitsched.vercel.app</text>

  <g filter="url(#panelShadow)" clip-path="url(#frame)">
    <rect x="712" y="38" width="430" height="424" rx="28" fill="#111615" stroke="#FFFFFF" stroke-opacity="0.11" />
  </g>

  <text x="748" y="78" fill="#7E8986" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.6">THIS WEEK</text>
  <g transform="translate(1010 55)">
    <rect width="96" height="34" rx="17" fill="#FF6B35" fill-opacity="0.10" stroke="#FF6B35" stroke-opacity="0.26" />
    <text x="18" y="22" fill="#FF8B61" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="800">14.2 FT</text>
  </g>

  <g transform="translate(748 104)" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle">
    <g><rect width="42" height="38" rx="11" fill="#FFFFFF" fill-opacity="0.035" stroke="#FFFFFF" stroke-opacity="0.08" /><text x="21" y="24" fill="#78827F">M</text></g>
    <g transform="translate(50)"><rect width="42" height="38" rx="11" fill="#FFFFFF" fill-opacity="0.035" stroke="#FFFFFF" stroke-opacity="0.08" /><text x="21" y="24" fill="#78827F">T</text></g>
    <g transform="translate(100)"><rect width="42" height="38" rx="11" fill="#1265FE" /><text x="21" y="24" fill="#FFFFFF">W</text></g>
    <g transform="translate(150)"><rect width="42" height="38" rx="11" fill="#FFFFFF" fill-opacity="0.035" stroke="#FFFFFF" stroke-opacity="0.08" /><text x="21" y="24" fill="#78827F">T</text></g>
    <g transform="translate(200)"><rect width="42" height="38" rx="11" fill="#FFFFFF" fill-opacity="0.035" stroke="#FFFFFF" stroke-opacity="0.08" /><text x="21" y="24" fill="#78827F">F</text></g>
    <g transform="translate(250)"><rect width="42" height="38" rx="11" fill="#FFFFFF" fill-opacity="0.035" stroke="#FFFFFF" stroke-opacity="0.08" /><text x="21" y="24" fill="#78827F">S</text></g>
    <g transform="translate(300)"><rect width="42" height="38" rx="11" fill="#FFFFFF" fill-opacity="0.035" stroke="#FFFFFF" stroke-opacity="0.08" /><text x="21" y="24" fill="#78827F">S</text></g>
  </g>

  <rect x="748" y="161" width="358" height="178" rx="20" fill="#0D1110" stroke="#FFFFFF" stroke-opacity="0.08" />
  <text x="770" y="190" fill="#8D9996" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.3">PUSH DAY · TODAY</text>
  <text x="770" y="221" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">Chest + shoulders</text>
  <g transform="translate(770 241)" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">
    <circle cx="7" cy="7" r="7" fill="#47E891" /><path d="M3.5 7L6 9.5L10.5 4.8" fill="none" stroke="#0B0F0E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    <text x="24" y="12" fill="#C5CDCB" font-weight="650">Bench press</text><text x="306" y="12" fill="#7E8986" text-anchor="end" font-weight="700">4 × 8</text>
    <g transform="translate(0 32)"><circle cx="7" cy="7" r="7" fill="#47E891" /><path d="M3.5 7L6 9.5L10.5 4.8" fill="none" stroke="#0B0F0E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /><text x="24" y="12" fill="#C5CDCB" font-weight="650">Overhead press</text><text x="306" y="12" fill="#7E8986" text-anchor="end" font-weight="700">3 × 10</text></g>
    <g transform="translate(0 64)"><circle cx="7" cy="7" r="7" fill="#28312F" /><text x="24" y="12" fill="#C5CDCB" font-weight="650">Cable flyes</text><text x="306" y="12" fill="#7E8986" text-anchor="end" font-weight="700">3 × 12</text></g>
  </g>

  <text x="748" y="371" fill="#8D9996" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.3">MUSCLE RECOVERY</text>
  <g transform="translate(748 389)" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="650">
    <circle cx="8" cy="8" r="6" fill="#EF4444" /><text x="21" y="13" fill="#9AA3A1">Chest</text>
    <g transform="translate(104)"><circle cx="8" cy="8" r="6" fill="#10B981" /><text x="21" y="13" fill="#9AA3A1">Back</text></g>
    <g transform="translate(196)"><circle cx="8" cy="8" r="6" fill="#F59E0B" /><text x="21" y="13" fill="#9AA3A1">Legs</text></g>
  </g>
  <rect x="748" y="428" width="358" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.08" />
  <rect x="748" y="428" width="354" height="6" rx="3" fill="url(#progress)" />
</svg>
